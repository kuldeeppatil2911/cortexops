services:
  - type: web
    name: cortexops
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend --omit=dev && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
